<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submit Research | PROE</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .submit-page {
      max-width: 850px;
      margin: 0 auto;
      padding: 55px 20px;
    }
    .submit-card {
      padding: 30px;
      border: 1px solid #e0e4f2;
      border-radius: 20px;
      background: var(--card, #fff);
      box-shadow: 0 16px 45px #171d3510;
    }
    .submit-card label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 600;
    }
    .submit-card input,
    .submit-card textarea,
    .submit-card select {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      border: 1px solid #d8dced;
      border-radius: 10px;
      font: inherit;
    }
    .submit-card textarea {
      min-height: 140px;
      resize: vertical;
    }
    .submit-card button {
      margin-top: 24px;
      padding: 14px 22px;
      border: 0;
      border-radius: 10px;
      background: #5148f5;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .submit-note {
      line-height: 1.6;
      color: #69738f;
    }
  </style>
</head>
<body>
  <main class="submit-page">
    <p><a href="index.html">← Back to home</a></p>

    <h1>Submit Your Research</h1>
    <p class="submit-note">
      Share your work with the PROE academic research community.
    </p>

    <section class="submit-card">
      <form id="paperForm">
        <label for="title">Paper title</label>
        <input id="title" name="title" maxlength="200" required>

        <label for="topic">Research topic</label>
        <select id="topic" name="topic" required>
          <option value="">Select a topic</option>
          <option>Artificial Intelligence</option>
          <option>Data Science</option>
          <option>Cybersecurity</option>
          <option>Web Development</option>
          <option>Other</option>
        </select>

        <label for="abstract">Abstract</label>
        <textarea id="abstract" name="abstract"
          minlength="30" maxlength="5000" required
          placeholder="Describe your research, objectives and findings..."></textarea>

        <label for="paperUrl">Paper URL (optional)</label>
        <input id="paperUrl" name="paperUrl" type="url"
          placeholder="https://example.com/my-paper.pdf">

        <button type="submit">Submit Research</button>
        <p id="formMessage" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script>
    document.getElementById("paperForm").addEventListener("submit", event => {
      event.preventDefault();

      document.getElementById("formMessage").textContent =
        "Your form is valid. Backend integration is still required to save this paper.";

    });
  </script>
</body>
</html>
