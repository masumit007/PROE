
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f8ff">
  <meta name="description" content="Explore research papers and topics from the PROE community.">
  <title>Explore Research Papers | PROE</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    .papers-page {
      width: 100%;
      max-width: 1100px;
      box-sizing: border-box;
      margin: 0 auto;
      padding: 50px 24px;
      min-height: 70vh;
    }

    .papers-page h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1.15;
      margin: 22px 0 12px;
    }

    .papers-page > p {
      line-height: 1.7;
    }

    .search-label {
      display: block;
      margin-top: 26px;
      font-weight: 600;
    }

    .paper-search {
      display: block;
      box-sizing: border-box;
      width: 100%;
      max-width: 650px;
      padding: 15px 18px;
      border: 1px solid #dce0f0;
      border-radius: 14px;
      margin: 12px 0 24px;
      font: inherit;
      background: var(--card, #fff);
      color: inherit;
      outline-offset: 3px;
    }

    .paper-list {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(min(240px, 100%), 1fr)
      );
      gap: 20px;
      margin-top: 25px;
    }

    .paper-item {
      min-width: 0;
      padding: 24px;
      border: 1px solid #e1e5f5;
      border-radius: 18px;
      background: var(--card, #fff);
      overflow-wrap: anywhere;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .paper-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px #5145ff18;
    }

    .paper-item h2 {
      font-size: 1.2rem;
      line-height: 1.4;
      margin: 12px 0;
    }

    .paper-item p {
      line-height: 1.7;
    }

    .paper-item .tag {
      color: #5b50f5;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .paper-link {
      display: inline-block;
      margin-top: 10px;
      color: #5b50f5;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .back-link {
      display: inline-block;
      margin-top: 10px;
      color: #5b50f5;
      font-weight: 700;
      text-decoration: none;
    }

    .back-link:hover,
    .paper-link:hover {
      text-decoration: underline;
    }

    .status-message {
      padding: 16px;
      border-radius: 12px;
      background: #f3f4ff;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .retry-button {
      padding: 11px 18px;
      border: 0;
      border-radius: 10px;
      background: #5b50f5;
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .retry-button:hover {
      opacity: 0.9;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 600px) {
      .papers-page {
        padding: 32px 18px;
      }

      .paper-item {
        padding: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .paper-item {
        transition: none;
      }

      .paper-item:hover {
        transform: none;
      }
    }
  </style>
</head>

<body>
  <main class="papers-page">
    <a class="back-link" href="index.html">← Back to Home</a>

    <h1>Explore Research Papers</h1>

    <p>
      Discover research topics and explore papers submitted to the
      PROE community.
    </p>

    <label class="search-label" for="paperSearch">
      Search by title or topic
    </label>

    <input
      class="paper-search"
      id="paperSearch"
      type="search"
      placeholder="Try artificial intelligence or security..."
      autocomplete="off"
      aria-label="Search research papers by title, topic, or abstract"
    >

    <p
      id="loadMessage"
      class="status-message"
      role="status"
      aria-live="polite"
    >
      Loading research papers...
    </p>

    <div class="paper-list" id="paperList"></div>

    <p id="emptyMessage" class="status-message" hidden>
      No matching papers found. Try another search.
    </p>

    <button id="retryButton" class="retry-button" type="button" hidden>
      Try Again
    </button>
  </main>

  <script>
    // Frontend connection to the existing local API.
    // No backend code is created or changed here.
    const API_URL = "http://localhost:8081/api/papers";

    const searchInput = document.getElementById("paperSearch");
    const paperList = document.getElementById("paperList");
    const loadMessage = document.getElementById("loadMessage");
    const emptyMessage = document.getElementById("emptyMessage");
    const retryButton = document.getElementById("retryButton");

    let papers = [];

    function showMessage(message) {
      loadMessage.textContent = message;
      loadMessage.hidden = false;
    }

    function getPaperUrl(paper) {
      return paper.paperUrl || paper.url || "";
    }

    function renderPapers() {
      const term = searchInput.value.trim().toLowerCase();

      const filteredPapers = papers.filter((paper) => {
        const searchableText = [
          paper.title,
          paper.topic,
          paper.abstract
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();

        return searchableText.includes(term);
      });

      paperList.replaceChildren();

      filteredPapers.forEach((paper) => {
        const article = document.createElement("article");
        article.className = "paper-item";

        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = paper.topic || "Research";

        const heading = document.createElement("h2");
        heading.textContent = paper.title || "Untitled paper";

        const abstract = document.createElement("p");
        abstract.textContent =
          paper.abstract || "No abstract provided.";

        article.append(tag, heading, abstract);

        const url = getPaperUrl(paper);

        if (url) {
          try {
            const parsedUrl = new URL(url);

            if (
              parsedUrl.protocol === "https:" ||
              parsedUrl.protocol === "http:"
            ) {
              const link = document.createElement("a");
              link.className = "paper-link";
              link.href = parsedUrl.href;
              link.target = "_blank";
              link.rel = "noopener noreferrer";
              link.textContent = "Read paper ↗";

              article.appendChild(link);
            }
          } catch {
            // Do not display an invalid paper link.
          }
        }

        paperList.appendChild(article);
      });

      loadMessage.hidden = true;
      emptyMessage.hidden = filteredPapers.length !== 0;
    }

    async function loadPapers() {
      showMessage("Loading research papers...");
      retryButton.hidden = true;
      emptyMessage.hidden = true;
      paperList.replaceChildren();

      try {
        const response = await fetch(API_URL);

        if (!response.ok) {
          if (response.status === 404) {
            throw new Error(
              "The papers-list API is not available."
            );
          }

          throw new Error(
            `Unable to load papers (HTTP ${response.status}).`
          );
        }

        const data = await response.json();

        // Accept either an array or an object with a papers array.
        const result = Array.isArray(data)
          ? data
          : data && Array.isArray(data.papers)
            ? data.papers
            : null;

        if (!result) {
          throw new Error(
            "The papers response has an unsupported format."
          );
        }

        papers = result;
        renderPapers();
      } catch (error) {
        papers = [];
        paperList.replaceChildren();

        showMessage(
  "Research papers are temporarily unavailable. Please try again shortly."
);

        retryButton.hidden = false;
      }
    }

    searchInput.addEventListener("input", renderPapers);
    retryButton.addEventListener("click", loadPapers);

    loadPapers();
  </script>
</body>
</html>
