<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | PROE</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-page {
      min-height: 85vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      padding: 32px;
      border: 1px solid #e0e4f2;
      border-radius: 22px;
      background: var(--card, #fff);
      box-shadow: 0 18px 60px #171d3510;
    }
    .auth-card h1 { margin: 0 0 10px; }
    .auth-card p { line-height: 1.6; }
    .auth-card label {
      display: block;
      margin: 18px 0 7px;
      font-weight: 600;
    }
    .auth-card input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #d8dced;
      border-radius: 10px;
      font: inherit;
    }
    .auth-card button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 11px;
      background: #5148f5;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .auth-card a { color: #5148f5; }
    .auth-message { margin-top: 12px; }
  </style>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <a href="index.html">← Back to home</a>
      <h1>Welcome back</h1>
      <p>Log in to continue your research journey with PROE.</p>

      <form id="loginForm">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email"
          autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password"
          autocomplete="current-password" required minlength="8">

        <button type="submit">Log in</button>
        <p id="loginMessage" class="auth-message" role="status"></p>
      </form>

      <p>New to PROE? <a href="register.html">Create an account</a></p>
    </section>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", event => {
      event.preventDefault();
      document.getElementById("loginMessage").textContent =
        "The form is valid, but login is not connected to the backend yet.";
    });
  </script>
</body>
</html>
